<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080a09">
    <title>Catálogo de Celulares | ON Soporte Informático</title>
    <meta name="description" content="Equipos celulares nuevos en caja sellada: Samsung, Xiaomi, POCO y Motorola. Precios actualizados en pesos argentinos.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ON Soporte Informático">
    <meta property="og:title" content="Catálogo de Celulares | ON Soporte Informático">
    <meta property="og:description" content="Consultá disponibilidad y precios actualizados de celulares Samsung, Xiaomi, POCO y Motorola.">
    <meta property="og:url" content="https://onsoporteinformatico.com/celulares.html">
    <meta property="og:image" content="https://onsoporteinformatico.com/assets/og-on-preview.png">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-main: #080a09;
            --bg-card: #111513;
            --border-card: #222925;
            --accent: #39d353;
            --accent-glow: rgba(57, 211, 83, 0.22);
            --text-main: #f3f5f4;
            --text-muted: #98a29c;
        }

        body {
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, rgba(57, 211, 83, 0.12) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .contenedor {
            width: 100%;
            max-width: 680px;
            margin: auto;
            padding: 26px 16px 96px;
        }

        .volver {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            border: 1px solid var(--border-card);
            border-radius: 999px;
            background: rgba(17, 21, 19, 0.85);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
            transition: all 0.2s ease;
        }

        .volver:hover {
            color: var(--accent);
            border-color: rgba(57, 211, 83, 0.45);
        }

        .logo {
            display: block;
            width: 100%;
            max-width: 210px;
            max-height: 85px;
            object-fit: contain;
            margin: 0 auto 16px;
            filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.6));
        }

        .logo-fallback {
            display: grid;
            place-items: center;
            width: 76px;
            height: 76px;
            margin: 0 auto 16px;
            border: 2px solid var(--accent);
            border-radius: 20px;
            background: rgba(57, 211, 83, 0.06);
            color: var(--accent);
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -2px;
        }

        .presentacion {
            text-align: center;
        }

        .etiqueta {
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 7px 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .intro {
            color: var(--text-muted);
            font-size: 13.5px;
            line-height: 1.55;
        }

        .linea {
            width: 58px;
            height: 3px;
            border-radius: 2px;
            margin: 16px auto 18px;
            background: var(--accent);
        }

        .info-cotizacion {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(57, 211, 83, 0.07);
            border: 1px solid rgba(57, 211, 83, 0.25);
            font-size: 12px;
            color: var(--text-muted);
        }

        .info-cotizacion strong {
            color: var(--accent);
        }

        /* =========================
           BUSCADOR Y FILTROS
        ========================= */
        .buscador-caja {
            position: relative;
            margin-bottom: 12px;
        }

        .buscador-input {
            width: 100%;
            padding: 13px 16px 13px 40px;
            border: 1px solid var(--border-card);
            border-radius: 13px;
            background: var(--bg-card);
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .buscador-input::placeholder {
            color: #6b756f;
        }

        .buscador-input:focus {
            border-color: var(--accent);
        }

        .buscador-icono {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            opacity: 0.65;
            pointer-events: none;
        }

        .filtros {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 1px 10px;
            margin-bottom: 6px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) #1a201d;
        }

        .filtro {
            flex: 0 0 auto;
            padding: 9px 14px;
            border: 1px solid var(--border-card);
            border-radius: 999px;
            background: var(--bg-card);
            color: var(--text-muted);
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filtro:hover,
        .filtro.activo {
            border-color: var(--accent);
            background: rgba(57, 211, 83, 0.14);
            color: var(--accent);
        }

        .estado-resultados {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 2px;
            color: #828e87;
            font-size: 12px;
        }

        /* =========================
           SECCIÓN POR MARCA Y GRILLA DE A 2
        ========================= */
        .secciones-marcas {
            display: flex;
            flex-direction: column;
            gap: 26px;
        }

        .marca-titulo-barra {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-card);
        }

        .marca-titulo-barra h2 {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .marca-cantidad {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--accent);
            background: rgba(57, 211, 83, 0.1);
            border: 1px solid rgba(57, 211, 83, 0.25);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .grid-celulares {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card-cel {
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
        }

        .card-cel:hover {
            border-color: rgba(57, 211, 83, 0.55);
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
        }

        .cel-media {
            position: relative;
            aspect-ratio: 1 / 1;
            background: radial-gradient(circle at 50% 35%, #1c2420 0%, #0b0e0d 100%);
            border-bottom: 1px solid var(--border-card);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            cursor: zoom-in;
            overflow: hidden;
        }

        .cel-media img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .card-cel:hover .cel-media img {
            transform: scale(1.05);
        }

        .cel-badge-marca {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(8, 10, 9, 0.85);
            border: 1px solid rgba(57, 211, 83, 0.35);
            color: var(--accent);
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            z-index: 2;
        }

        .cel-badge-5g {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 3px 7px;
            border-radius: 6px;
            background: rgba(57, 211, 83, 0.18);
            border: 1px solid rgba(57, 211, 83, 0.4);
            color: #9bf6a9;
            font-size: 9.5px;
            font-weight: 800;
            z-index: 2;
        }

        .cel-cuerpo {
            display: flex;
            flex: 1;
            flex-direction: column;
            padding: 13px;
            gap: 8px;
        }

        .cel-modelo {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.25;
        }

        .cel-memoria {
            display: inline-block;
            align-self: flex-start;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
        }

        .cel-pie {
            margin-top: auto;
            padding-top: 8px;
            border-top: 1px solid rgba(34, 41, 37, 0.75);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .cel-precio {
            font-size: 16.5px;
            font-weight: 800;
            color: var(--accent);
        }

        .cel-precio.consultar {
            font-size: 13.5px;
            color: #ffd56b;
        }

        .btn-pedir {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            min-height: 38px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid #315b35;
            background: #142218;
            color: #65e476;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .btn-pedir:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #051107;
        }

        .sin-resultados {
            padding: 36px 16px;
            text-align: center;
            border: 1px dashed var(--border-card);
            border-radius: 14px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* =========================
           LIGHTBOX VISTA AMPLIADA
        ========================= */
        .visor {
            position: fixed;
            inset: 0;
            z-index: 90;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(4, 6, 5, 0.9);
            backdrop-filter: blur(8px);
        }

        .visor.abierto {
            display: flex;
        }

        .visor-caja {
            position: relative;
            width: 100%;
            max-width: 390px;
            background: var(--bg-card);
            border: 1px solid rgba(57, 211, 83, 0.45);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .visor-cerrar {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 3;
            width: 34px;
            height: 34px;
            border: 1px solid var(--border-card);
            border-radius: 50%;
            background: rgba(8, 10, 9, 0.85);
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }

        .visor-img-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: radial-gradient(circle at 50% 40%, #1d2622 0%, #090c0b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .visor-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .visor-info {
            padding: 16px 18px 18px;
        }

        .visor-info h3 {
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .visor-info p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 12px;
        }

        /* =========================
           BLOQUE CONSULTA Y PIE
        ========================= */
        .nota-legal {
            margin-top: 22px;
            color: #7c8780;
            text-align: center;
            font-size: 11.5px;
            line-height: 1.5;
        }

        .a-medida {
            margin-top: 18px;
            padding: 20px 18px;
            border: 1px dashed rgba(57, 211, 83, 0.4);
            border-radius: 16px;
            background: linear-gradient(180deg, #121914 0%, #0e1210 100%);
            text-align: center;
        }

        .a-medida strong {
            display: block;
            font-size: 15.5px;
            color: var(--text-main);
        }

        .a-medida p {
            margin: 6px 0 14px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .boton-primario {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #72f47d;
            border-radius: 12px;
            background: linear-gradient(135deg, #43df5a, #27bd43);
            box-shadow: 0 5px 18px var(--accent-glow);
            color: #051107;
            font-size: 13.5px;
            font-weight: 800;
            text-decoration: none;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .boton-primario:hover {
            transform: translateY(-2px);
            filter: brightness(1.06);
        }

        .pie {
            margin-top: 32px;
            padding-top: 22px;
            border-top: 1px solid var(--border-card);
            text-align: center;
            color: #6b756f;
            font-size: 11px;
            letter-spacing: 1.5px;
        }

        .pie a {
            display: inline-block;
            margin-top: 10px;
            color: var(--accent);
            text-decoration: none;
            letter-spacing: 0;
            font-size: 13px;
            font-weight: 700;
        }

        .wsp-flotante {
            position: fixed;
            right: 18px;
            bottom: 18px;
