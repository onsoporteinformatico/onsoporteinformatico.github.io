    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-main: #080a09;
            --bg-card: #111513;
            --border-card: #222925;
            --accent: #39d353;
            --accent-glow: rgba(57, 211, 83, 0.22);
            --text-main: #f3f5f4;
            --text-muted: #98a29c;
        }

        body {
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, rgba(57, 211, 83, 0.12) 0%, transparent 55%);
            color: var(--text-main);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .contenedor {
            width: 100%;
            max-width: 640px;
            margin: auto;
            padding: 44px 22px 96px;
        }

        /* =========================
           LOGO & HEADER
        ========================= */
        .logo {
            display: block;
            width: 100%;
            max-width: 320px;
            margin: 0 auto 26px;
            filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.6));
        }

        .logo-fallback {
            display: grid;
            place-items: center;
            width: 112px;
            height: 112px;
            margin: 0 auto 26px;
            border: 2px solid var(--accent);
            border-radius: 28px;
            background: rgba(57, 211, 83, 0.06);
            color: var(--accent);
            font-size: 46px;
            font-weight: 800;
            letter-spacing: -3px;
        }

        .badge-estado {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 auto 16px;
            padding: 7px 16px;
            border-radius: 999px;
            background: rgba(57, 211, 83, 0.1);
            border: 1px solid rgba(57, 211, 83, 0.28);
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.6px;
        }

        .badge-estado.cerrado {
            background: rgba(255, 193, 7, 0.08);
            border-color: rgba(255, 193, 7, 0.3);
            color: #ffd56b;
        }

        .punto-activo {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            flex-shrink: 0;
        }

        .badge-estado.cerrado .punto-activo {
            background: #ffd56b;
            box-shadow: 0 0 8px #ffd56b;
        }

        .header-centro {
            text-align: center;
        }

        .titulo {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 2.2px;
            text-transform: uppercase;
        }

        .subtitulo {
            color: var(--text-muted);
            font-size: 14px;
            letter-spacing: 1.5px;
            margin-top: 8px;
        }

        .linea {
            width: 60px;
            height: 3px;
            border-radius: 2px;
            background: var(--accent);
            margin: 24px auto 32px;
        }

        /* =========================
           BLOQUES DE SERVICIO
        ========================= */
        .servicios {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .servicio {
            padding: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
        }

        .servicio:hover {
            border-color: rgba(57, 211, 83, 0.55);
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        }

        .servicio-destacado {
            border-color: rgba(57, 211, 83, 0.35);
            background: linear-gradient(180deg, #131b16 0%, #101412 100%);
        }

        .servicio h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 9px;
        }

        .servicio p {
            color: var(--text-muted);
            font-size: 14.5px;
            line-height: 1.6;
        }

        /* =========================
           BOTONES
        ========================= */
        .botones {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 30px;
        }

        .boton {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 58px;
            padding: 15px 20px;
            background: var(--bg-card);
            border: 1px solid #2d3631;
            border-radius: 15px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 15.5px;
            font-weight: 600;
            transition: all 0.22s ease;
        }

        .boton:hover {
            background: #19211d;
            border-color: var(--accent);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .boton-primario,
        .boton-catalogo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            min-height: 58px;
            padding: 15px 20px;
            border: 1px solid #72f47d;
            border-radius: 15px;
            background: linear-gradient(135deg, #43df5a, #27bd43);
            box-shadow: 0 6px 20px var(--accent-glow);
            color: #051107;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.4px;
            text-align: center;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .boton-catalogo {
            margin-top: 16px;
            min-height: 52px;
            font-size: 14px;
            border-radius: 13px;
        }

        .boton-primario:hover,
        .boton-catalogo:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(57, 211, 83, 0.38);
            filter: brightness(1.06);
        }

        .boton-secundario-acento {
            margin-top: 16px;
            min-height: 50px;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            border-color: rgba(57, 211, 83, 0.45);
            background: rgba(57, 211, 83, 0.06);
        }

        .boton-secundario-acento:hover {
            background: var(--accent);
            color: #051107;
        }

        .icono {
            font-size: 19px;
            line-height: 1;
        }

        /* =========================
           UBICACIÓN Y HORARIOS
        ========================= */
        .info-local {
            margin-top: 28px;
            padding: 22px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 18px;
        }

        .info-local h2 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 14px;
        }

        .info-lista {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .info-item strong {
            color: var(--text-main);
            font-weight: 600;
        }

        /* =========================
           PREGUNTAS FRECUENTES
        ========================= */
        .faq {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .faq-titulo {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
            padding-left: 2px;
        }

        .faq details {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            padding: 16px 18px;
            transition: border-color 0.2s ease;
        }

        .faq details[open] {
            border-color: rgba(57, 211, 83, 0.45);
        }

        .faq summary {
            list-style: none;
            cursor: pointer;
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .faq summary::-webkit-details-marker {
            display: none;
        }

        .faq summary::after {
            content: "+";
            color: var(--accent);
            font-size: 20px;
            font-weight: 700;
            line-height: 1;
        }

        .faq details[open] summary::after {
            content: "−";
        }

        .faq details p {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-card);
            color: var(--text-muted);
            font-size: 13.5px;
            line-height: 1.55;
        }

        /* =========================
           EXPERIENCIA
        ========================= */
        .experiencia {
            margin-top: 32px;
            padding: 26px 20px;
            text-align: center;
            border-top: 1px solid var(--border-card);
            border-bottom: 1px solid var(--border-card);
        }

        .experiencia h2 {
            font-size: 15.5px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: 1.5px;
        }

        .experiencia p {
            color: var(--text-muted);
            font-size: 14.5px;
            line-height: 1.6;
        }

        /* =========================
           PIE
        ========================= */
        .pie {
            margin-top: 34px;
            text-align: center;
        }

        .pie-texto {
            color: #6b756f;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.8px;
            margin-bottom: 16px;
        }

        .logo-pie {
            display: block;
            width: 84px;
            margin: 0 auto;
            opacity: 0.9;
        }

        .logo-pie-fallback {
            display: grid;
            place-items: center;
            width: 58px;
            height: 58px;
            margin: 0 auto;
            border: 1px solid var(--accent);
            border-radius: 15px;
            color: var(--accent);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        .copyright {
            color: #525a55;
            font-size: 11.5px;
            margin-top: 14px;
        }

        /* =========================
           BOTÓN FLOTANTE WHATSAPP
        ========================= */
        .wsp-flotante {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 13px 18px;
            border-radius: 999px;
            background: #25d366;
            color: #05140a;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(37, 211, 102, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
